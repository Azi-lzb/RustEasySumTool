[package]
name = "excel-summary-rust"
version = "0.6.2"
edition = "2024"
description = "Excel template aggregation library and desktop CLI"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:ctrlc", "dep:rfd"]

[lib]
name = "excel_summary"
path = "src/lib.rs"

[[bin]]
name = "excel-summary-rust"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
bigdecimal = "0.4.11"
calamine = "0.38"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"], optional = true }
ctrlc = { version = "3.4", optional = true }
dunce = "1"
num-integer = "0.1"
regex = "1"
rfd = { version = "0.15", optional = true }
roxmltree = "0.21"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
umya-spreadsheet = "=3.1.1"
unicode-casefold = "0.2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
strip = true
